[project]
name = "velis"
version = "0.1.0"
description = "Lightweight, thread-safe in-memory store with WAL crash recovery, pub-sub, TTL expiration, pluggable codecs and a protocol selector layer"
readme = "README.md"
authors = [
    { name = "Giorgi Chapidze", email = "chapidze.giorgi@proton.me" }
]
requires-python = ">=3.15.2"
dependencies = []

[project.scripts]
velis = "velis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"