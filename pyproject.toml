[project]
name = "velis"
version = "0.1.0"
description = "In-memory store with pluggable codecs (WIP: WAL recovery, pub-sub, TTL, protocol layer)"
readme = "README.md"
authors = [
    { name = "Giorgi Chapidze", email = "chapidze.giorgi@proton.me" }
]
requires-python = ">=3.15.2"
dependencies = []

[project.scripts]
velis = "velis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"